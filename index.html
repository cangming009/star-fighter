<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>星际战机 V13</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; touch-action: none; }
        #gameContainer { position: relative; width: 320px; height: 520px; background: linear-gradient(to bottom, #0a0a20, #1a1a3a); overflow: hidden; }
        canvas { display: block; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); z-index: 10; overflow-y: auto; }
        .hidden { display: none !important; }
        .title { font-size: 26px; color: #0ff; text-shadow: 0 0 15px #0ff; margin-bottom: 5px; }
        .subtitle { font-size: 12px; color: #888; margin-bottom: 15px; }
        .btn { padding: 10px 35px; margin: 6px; font-size: 14px; border: none; border-radius: 20px; cursor: pointer; background: linear-gradient(135deg, #00ccff, #0066ff); color: white; font-weight: bold; }
        .diff-select { display: flex; gap: 8px; margin: 15px 0; }
        .diff-btn { padding: 6px 15px; border: 2px solid #0ff; border-radius: 15px; background: transparent; color: #0ff; font-size: 12px; cursor: pointer; }
        .diff-btn.active { background: #0ff; color: #000; }
        .weapon-panel { margin: 15px 0; }
        .weapon-title { color: #aaa; font-size: 12px; margin-bottom: 8px; }
        .weapon-grid { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .weapon-card { width: 60px; height: 60px; border: 2px solid #444; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.05); }
        .weapon-card.selected { border-color: #0f0; background: rgba(0,255,0,0.2); }
        .weapon-card .icon { font-size: 20px; }
        .weapon-card .name { font-size: 10px; color: #fff; margin-top: 3px; }
        .leaderboard { margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; width: 80%; }
        .leaderboard h3 { color: #ffd700; font-size: 14px; text-align: center; margin-bottom: 8px; }
        .leaderboard table { width: 100%; font-size: 11px; color: #ccc; }
        .leaderboard td { padding: 3px 5px; text-align: center; }
        .rank-1 { color: #ffd700; }
        .rank-2 { color: #c0c0c0; }
        .rank-3 { color: #cd7f32; }
        #hud { position: absolute; top: 0; left: 0; right: 0; padding: 8px 12px; background: rgba(0,0,0,0.7); display: flex; justify-content: space-between; color: #fff; font-size: 11px; z-index: 5; }
        #weaponIcon { color: #0ff; margin-left: 10px; }
        #hpBar { position: absolute; bottom: 85px; left: 10px; width: 80px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; z-index: 5; }
        #hpFill { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #0f0); }
        #bossHpBar { position: absolute; top: 35px; left: 50%; transform: translateX(-50%); width: 150px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; z-index: 5; display: none; }
        #bossHpFill { width: 100%; height: 100%; background: #f00; }
        #touchControls { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 5; }
        #joystick { width: 70px; height: 70px; background: rgba(255,255,255,0.1); border: 2px solid rgba(0,255,255,0.3); border-radius: 50%; position: relative; }
        #joystickKnob { width: 35px; height: 35px; background: rgba(0,255,255,0.5); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #fireBtn { width: 60px; height: 60px; background: rgba(255,0,0,0.5); border: 3px solid #f00; border-radius: 50%; font-size: 12px; color: #fff; font-weight: bold; }
        #fireBtn:active { background: rgba(255,0,0,0.8); }
        .hint { position: absolute; bottom: 85px; width: 100%; text-align: center; color: #666; font-size: 10px; z-index: 5; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="320" height="520"></canvas>
        <div id="mainMenu" class="screen">
            <div class="title">🚀 星际战机</div>
            <div class="subtitle">V13 武器系统版</div>
            <div class="diff-select">
                <button class="diff-btn active" onclick="setDiff('easy')">简单</button>
                <button class="diff-btn" onclick="setDiff('medium')">中等</button>
                <button class="diff-btn" onclick="setDiff('hard')">困难</button>
            </div>
            <div class="weapon-panel">
                <div class="weapon-title">选择武器</div>
                <div class="weapon-grid">
                    <div class="weapon-card selected" onclick="selectWeapon('normal')"><div class="icon">📍</div><div class="name">单发</div></div>
                    <div class="weapon-card" onclick="selectWeapon('double')"><div class="icon">||</div><div class="name">双发</div></div>
                    <div class="weapon-card" onclick="selectWeapon('triple')"><div class="icon">|||</div><div class="name">三发</div></div>
                    <div class="weapon-card" onclick="selectWeapon('spread')"><div class="icon">🔥</div><div class="name">散弹</div></div>
                </div>
            </div>
            <button class="btn" onclick="startGame()">开始游戏</button>
            <div class="leaderboard"><h3>🏆 排行榜</h3><table id="leaderboardTable"><tr><td colspan="3">暂无数据</td></tr></table></div>
        </div>
        <div id="hud" class="hidden"><div><span>关卡 <span id="levelDisp">1</span></span><span id="weaponIcon">📍</span></div><div>分数: <span id="scoreDisp">0</span></div></div>
        <div id="bossHpBar"><div id="bossHpFill"></div></div>
        <div id="hpBar" class="hidden"><div id="hpFill"></div></div>
        <div class="hint hidden" id="hint">WASD/方向键 | 空格射击</div>
        <div id="touchControls" class="hidden">
            <div id="joystick"><div id="joystickKnob"></div></div>
            <button id="fireBtn">开火</button>
        </div>
        <div id="gameOverMenu" class="screen hidden">
            <div class="title">💀 游戏结束</div>
            <p style="color:#fff;margin:8px;">得分: <span id="finalScore" style="color:#ffd700;font-size:20px;">0</span></p>
            <p style="color:#888;font-size:12px;">关卡: <span id="finalLevel">1</span></p>
            <button class="btn" onclick="startGame()">再来一局</button>
            <button class="btn" onclick="showMenu()">返回菜单</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const WEAPONS = { normal: {name:'单发',icon:'📍',cooldown:12,shoot:p=>[{x:p.x,y:p.y-25}]},double:{name:'双发',icon:'||',cooldown:14,shoot:p=>[{x:p.x-8,y:p.y-20},{x:p.x+8,y:p.y-20}]},triple:{name:'三发',icon:'|||',cooldown:16,shoot:p=>[{x:p.x,y:p.y-25},{x:p.x-10,y:p.y-18},{x:p.x+10,y:p.y-18}]},spread:{name:'散弹',icon:'🔥',cooldown:18,shoot:p=>[{x:p.x,y:p.y-20,vx:0},{x:p.x,y:p.y-18,vx:-2},{x:p.x,y:p.y-18,vx:2},{x:p.x,y:p.y-15,vx:-4},{x:p.x,y:p.y-15,vx:4}]}};
        const CONFIG = { easy:{playerHp:150,enemyHp:0.6,enemySpeed:1.2,spawnRate:55,enemyDmg:5,bossHp:200},medium:{playerHp:100,enemyHp:1,enemySpeed:2,spawnRate:40,enemyDmg:8,bossHp:350},hard:{playerHp:60,enemyHp:1.5,enemySpeed:3,spawnRate:25,enemyDmg:12,bossHp:500}};
        const ENEMY_TYPES = [{w:28,h:22,hp:12,color:'#f66',speed:1.5,score:10,drop:'none'},{w:22,h:18,hp:6,color:'#ff6',speed:2.5,score:8,drop:'none'},{w:35,h:30,hp:35,color:'#f33',speed:1,score:20,drop:'double'},{w:40,h:35,hp:50,color:'#f0f',speed:0.8,score:30,drop:'triple'},{w:30,h:25,hp:20,color:'#0ff',speed:1.8,score:15,drop:'spread'}];
        const BOSS_CONFIG = [{name:'BOSS-1',w:80,h:60,hp:140,color:'#f00',speed:0.8,bullets:3},{name:'BOSS-2',w:100,h:70,hp:245,color:'#f0f',speed:1,bullets:5},{name:'BOSS-3',w:120,h:80,hp:350,color:'#ff0',speed:1.2,bullets:7}];
        let diff='easy',selectedWeapon='normal',running=false,score=0,level=1,lastTime=0,spawnTimer=0,player={x:160,y:440,w:30,h:40,hp:100,maxHp:100,speed:4,cooldown:0,weapon:'normal'},bullets=[],enemies=[],particles=[],enemyBullets=[],boss=null,bossTimer=0,leaderboard=JSON.parse(localStorage.getItem('gomokuLeaderboard'))||[],keys={},audioCtx=null;
        function playSound(t){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const n=audioCtx.currentTime;if(t==='shoot'){o.frequency.setValueAtTime(600,n);o.frequency.exponentialRampToValueAtTime(200,n+0.06);g.gain.setValueAtTime(0.12,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.06);o.start(n);o.stop(n+0.06);}else if(t==='explode'){o.type='sawtooth';o.frequency.setValueAtTime(120,n);o.frequency.exponentialRampToValueAtTime(20,n+0.15);g.gain.setValueAtTime(0.15,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.15);o.start(n);o.stop(n+0.15);}else if(t==='powerup'){o.type='sine';o.frequency.setValueAtTime(523,n);o.frequency.setValueAtTime(659,n+0.1);o.frequency.setValueAtTime(784,n+0.2);g.gain.setValueAtTime(0.15,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.25);o.start(n);o.stop(n+0.25);}else if(t==='boss'){o.type='square';o.frequency.setValueAtTime(100,n);g.gain.setValueAtTime(0.2,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.5);o.start(n);o.stop(n+0.5);}}catch(e){}}
        function init(){updateLeaderboard();document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});document.addEventListener('keyup',e=>keys[e.code]=false);const joy=document.getElementById('joystick'),knob=document.getElementById('joystickKnob');let jx,jy,joyDown=false;joy.addEventListener('touchstart',e=>{jx=e.touches[0].clientX;jy=e.touches[0].clientY;joyDown=true;});joy.addEventListener('touchmove',e=>{if(!joyDown)return;const dx=e.touches[0].clientX-jx,dy=e.touches[0].clientY-jy,d=Math.min(18,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);knob.style.transform=`translate(calc(-50%+${Math.cos(a)*d}px),calc(-50%+${Math.sin(a)*d}px))`;keys['ArrowLeft']=dx<-12;keys['ArrowRight']=dx>12;keys['ArrowUp']=dy>12;keys['ArrowDown']=dy<-12;});joy.addEventListener('touchend',()=>{joyDown=false;knob.style.transform='translate(-50%,-50%)';keys['ArrowLeft']=keys['ArrowRight']=keys['ArrowUp']=keys['ArrowDown']=false;});document.getElementById('fireBtn').addEventListener('touchstart',e=>{e.preventDefault();keys['Space']=true;});document.getElementById('fireBtn').addEventListener('touchend',e=>{e.preventDefault();keys['Space']=false;});requestAnimationFrame(gameLoop);}
        function setDiff(d){diff=d;document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');}
        function selectWeapon(w){selectedWeapon=w;document.querySelectorAll('.weapon-card').forEach(c=>c.classList.remove('selected'));event.currentTarget.classList.add('selected');}
        function updateLeaderboard(){const t=document.getElementById('leaderboardTable');if(leaderboard.length===0){t.innerHTML='<tr><td colspan="3">暂无数据</td></tr>';return;}t.innerHTML='';leaderboard.slice(0,5).forEach((e,i)=>{const c=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';t.innerHTML+=`<tr><td class="${c}">${i+1}</td><td>玩家</td><td>${e.score||0}</td></tr>`;});}
        function showMenu(){running=false;document.getElementById('mainMenu').classList.remove('hidden');document.getElementById('gameOverMenu').classList.add('hidden');document.getElementById('hud').classList.add('hidden');document.getElementById('hpBar').classList.add('hidden');document.getElementById('hint').classList.add('hidden');document.getElementById('touchControls').classList.add('hidden');document.getElementById('bossHpBar').style.display='none';updateLeaderboard();}
        function startGame(){const c=CONFIG[diff];player={x:160,y:440,w:30,h:40,hp:c.playerHp,maxHp:c.playerHp,speed:4,cooldown:0,weapon:selectedWeapon};bullets=[];enemies=[];particles=[];enemyBullets=[];boss=null;score=0;level=1;spawnTimer=0;bossTimer=0;document.getElementById('mainMenu').classList.add('hidden');document.getElementById('gameOverMenu').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('hpBar').classList.remove('hidden');document.getElementById('hint').classList.remove('hidden');document.getElementById('touchControls').classList.remove('hidden');running=true;lastTime=performance.now();}
        function spawnEnemy(){const c=CONFIG[diff],t=ENEMY_TYPES[Math.floor(Math.random()*ENEMY_TYPES.length)];enemies.push({x:25+Math.random()*270,y:-40,w:t.w,h:t.h,hp:t.hp*c.enemyHp,speed:t.speed,color:t.color,score:t.score,drop:t.drop});}
        function spawnBoss(){const c=CONFIG[diff],b=BOSS_CONFIG[Math.min(level-1,BOSS_CONFIG.length-1)],movePattern=Math.floor(Math.random()*3);boss={x:160,y:-80,w:b.w,h:b.h,hp:b.hp*c.bossHp/200,maxHp:b.hp*c.bossHp/200,speed:b.speed,color:b.color,bullets:b.bullets,timer:0,dir:1,movePattern,scale:0,targetScale:1,zigzagTime:0};document.getElementById('bossHpBar').style.display='block';playSound('boss');}
        function shoot(){if(player.cooldown>0)return;const w=WEAPONS[player.weapon];player.cooldown=w.cooldown;playSound('shoot');w.shoot(player).forEach(s=>{bullets.push({x:s.x,y:s.y,w:s.vx!==undefined?8:6,h:s.vx!==undefined?8:14,speed:8,vx:s.vx||0,vy:s.vy||-8});});}
        function bossShoot(){if(!boss)return;for(let i=0;i<boss.bullets;i++){const a=(Math.PI/(boss.bullets-1))*i;enemyBullets.push({x:boss.x,y:boss.y+boss.h/2,w:8,h:12,speed:3,vx:Math.cos(a)*3*(i>0&&i<boss.bullets-1?0:1),vy:3});}}
        function createExplosion(x,y,color,count=12){for(let i=0;i<count;i++){particles.push({x,y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:1,color,size:3+Math.random()*5});}}
        function dropPowerup(x,y,type){if(type==='none')return;particles.push({x,y,type:'powerup',vx:0,vy:1.5,life:1,color:type==='double'?'#0f0':type==='triple'?'#0ff':type==='spread'?'#f0f':'#ff0',weapon:type});}
        function gameLoop(timestamp){const dt=Math.min(timestamp-lastTime,50)/16.67;lastTime=timestamp;if(running){if(keys['ArrowLeft']||keys['KeyA'])player.x-=player.speed*dt;if(keys['ArrowRight']||keys['KeyD'])player.x+=player.speed*dt;if(keys['ArrowUp']||keys['KeyW'])player.y+=player.speed*dt;if(keys['ArrowDown']||keys['KeyS'])player.y-=player.speed*dt;player.x=Math.max(20,Math.min(300,player.x));player.y=Math.max(50,Math.min(480,player.y));if(player.cooldown>0)player.cooldown--;if(keys['Space']||keys['KeyJ'])shoot();if(!boss){spawnTimer+=dt;if(spawnTimer>CONFIG[diff].spawnRate){spawnEnemy();spawnTimer=0;}}if(boss){boss.scale<boss.targetScale?boss.scale+=0.02*dt:0;if(boss.y>=80){if(boss.movePattern===0){boss.x+=boss.dir*boss.speed*dt;if(boss.x<60||boss.x>260)boss.dir*=-1}else if(boss.movePattern===1){boss.zigzagTime+=dt*0.05;boss.x=160+Math.sin(boss.zigzagTime)*100}else{const dx=player.x-boss.x;boss.x+=Math.sign(dx)*Math.min(Math.abs(dx)*0.05,boss.speed)*dt}}boss.y+=boss.speed*0.5*dt;if(boss.y<80)boss.y+=boss.speed*0.3*dt;boss.timer+=dt;if(boss.timer>60){bossShoot();boss.timer=0};}if(level%3===0&&!boss&&score>=level*300)spawnBoss();bullets.forEach(b=>{b.x+=(b.vx||0)*dt;b.y+=(b.vy||-b.speed)*dt;});bullets=bullets.filter(b=>b.y>-20&&b.y<550&&b.x>-20&&b.x<340);enemies.forEach(e=>e.y+=e.speed*dt);enemyBullets.forEach(b=>{b.x+=(b.vx||0)*dt;b.y+=b.vy*dt;});enemyBullets=enemyBullets.filter(b=>b.y<550);bullets.forEach((b,bi)=>{enemies.forEach((e,ei)=>{if(Math.abs(b.x-e.x)<(b.w+e.w)/2&&Math.abs(b.y-e.y)<(b.h+e.h)/2){e.hp-=10;createExplosion(b.x,b.y,'#ff0',4);bullets.splice(bi,1);if(e.hp<=0){score+=e.score;createExplosion(e.x,e.y,e.color,15);dropPowerup(e.x,e.y,e.drop);enemies.splice(ei,1);}}});if(boss&&Math.abs(b.x-boss.x)<(b.w+boss.w)/2&&Math.abs(b.y-boss.y)<(b.h+boss.h)/2){boss.hp-=8;createExplosion(b.x,b.y,'#f00',5);bullets.splice(bi,1);document.getElementById('bossHpFill').style.width=(boss.hp/boss.maxHp*100)+'%';if(boss.hp<=0){score+=200;createExplosion(boss.x,boss.y,boss.color,40);boss=null;document.getElementById('bossHpBar').style.display='none';level++;}}});enemies.forEach((e,ei)=>{if(Math.abs(player.x-e.x)<(player.w+e.w)/2&&Math.abs(player.y-e.y)<(player.h+e.h)/2){player.hp-=CONFIG[diff].enemyDmg;createExplosion(e.x,e.y,e.color,12);enemies.splice(ei,1);if(player.hp<=0)gameOver();}});enemyBullets.forEach((b,bi)=>{if(Math.abs(player.x-b.x)<(player.w+b.w)/2&&Math.abs(player.y-b.y)<(player.h+b.h)/2){player.hp-=8;createExplosion(player.x,player.y,'#f00',6);enemyBullets.splice(bi,1);if(player.hp<=0)gameOver();}});particles.forEach((p,pi)=>{if(p.type==='powerup'){p.y+=p.vy*dt;if(Math.abs(player.x-p.x)<25&&Math.abs(player.y-p.y)<30){player.weapon=p.weapon;document.getElementById('weaponIcon').textContent=WEAPONS[p.weapon].icon;playSound('powerup');particles.splice(pi,1);}else if(p.y>550)particles.splice(pi,1);}else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=0.04*dt;}});particles=particles.filter(p=>p.life>0);enemies=enemies.filter(e=>e.y<550);if(score>level*400&&!boss)level++;document.getElementById('scoreDisp').textContent=score;document.getElementById('levelDisp').textContent=level;document.getElementById('hpFill').style.width=(player.hp/player.maxHp*100)+'%';}draw();requestAnimationFrame(gameLoop);}
        function gameOver(){running=false;const e={score,level,date:new Date().toLocaleDateString()};leaderboard.unshift(e);leaderboard.sort((a,b)=>b.score-a.score);leaderboard=leaderboard.slice(0,10);localStorage.setItem('gomokuLeaderboard',JSON.stringify(leaderboard));document.getElementById('finalScore').textContent=score;document.getElementById('finalLevel').textContent=level;document.getElementById('gameOverMenu').classList.remove('hidden');}
        function draw(){ctx.fillStyle='#0a0a20';ctx.fillRect(0,0,320,520);ctx.fillStyle='#fff';for(let i=0;i<60;i++){const x=(i*67)%320,y=(i*89+(running?Date.now()*0.03:0))%520;ctx.fillRect(x,y,1,1);}if(!running&&document.getElementById('mainMenu').classList.contains('hidden')&&document.getElementById('gameOverMenu').classList.contains('hidden'))return;ctx.fillStyle='#f44';enemyBullets.forEach(b=>{ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);});bullets.forEach(b=>{const g=ctx.createLinearGradient(b.x,b.y-b.h,b.x,b.y);g.addColorStop(0,'#fff');g.addColorStop(1,b.vx?'#f0f':'#0ff');ctx.fillStyle=g;ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);});enemies.forEach(e=>{ctx.fillStyle=e.color;ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(e.x-e.w/4,e.y-e.h/4,e.w/2,e.h/4);});if(boss){ctx.fillStyle=boss.color;ctx.fillRect(boss.x-boss.w*boss.scale/2,boss.y-boss.h*boss.scale/2,boss.w*boss.scale,boss.h*boss.scale);ctx.fillStyle='#fff';ctx.fillRect(boss.x-boss.w/4,boss.y-boss.h/4,boss.w/2,boss.h/3);ctx.fillStyle='#ff0';ctx.fillRect(boss.x-15,boss.y-10,8,8);ctx.fillRect(boss.x+7,boss.y-10,8,8);}particles.forEach(p=>{if(p.type==='powerup'){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}else{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}});ctx.fillStyle='#0cf';ctx.beginPath();ctx.moveTo(player.x,player.y-player.h/2);ctx.lineTo(player.x-player.w/2,player.y+player.h/2);ctx.lineTo(player.x+player.w/2,player.y+player.h/2);ctx.closePath();ctx.fill();ctx.fillStyle='#0ff';ctx.beginPath();ctx.arc(player.x,player.y-5,6,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.weapon==='spread'?'#f0f':player.weapon==='triple'?'#0ff':player.weapon==='double'?'#0f0':'#0ff';ctx.fillRect(player.x-2,player.y-player.h/2-5,4,8);}
        init();
    </script>
</body>
</html>
