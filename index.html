<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星际战机 V10 - 3D版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; background: linear-gradient(180deg, #050510, #0a0a20); font-family: -apple-system, sans-serif; min-height: 100vh; overscroll-behavior: none; }
        .title { color: #00ffff; font-size: 18px; font-weight: 800; text-shadow: 0 0 15px #00ffff; margin-bottom: 8px; }
        .version { font-size: 10px; color: #ffd700; margin-left: 5px; }
        #gameContainer { position: relative; width: 90%; max-width: 320px; }
        #infoBar { display: none; width: 100%; justify-content: space-between; padding: 5px 8px; background: rgba(0,20,40,0.85); border: 1px solid rgba(0,255,255,0.3); border-radius: 5px; margin-bottom: 5px; }
        #infoBar.show { display: flex; }
        .info-item { color: #fff; font-size: 9px; }
        .hp-bar { width: 40px; height: 4px; background: #222; border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; }
        .hp-fill { height: 100%; background: linear-gradient(90deg, #4f4, #8f8); width: 100%; }
        #gameCanvas { display: none; width: 100%; aspect-ratio: 3/4; border: 2px solid rgba(0,255,255,0.4); border-radius: 8px; background: #020208; }
        #gameCanvas.show { display: block; }
        #hint { display: none; color: rgba(255,255,255,0.3); font-size: 8px; margin-top: 5px; text-align: center; }
        #hint.show { display: block; }
        .menu { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #050510, #0a0a25); z-index: 100; padding: 15px; }
        .menu.hidden { display: none; }
        .menu-title { color: #00ffff; font-size: 26px; font-weight: 900; margin-bottom: 6px; text-shadow: 0 0 20px #00ffff; }
        .menu-subtitle { color: #ffd700; font-size: 12px; margin-bottom: 15px; }
        .menu-features p { color: rgba(255,255,255,0.6); font-size: 11px; margin: 5px 0; }
        .menu-features .highlight { color: #ffd700; }
        .difficulty-select { display: flex; gap: 8px; margin: 12px 0; }
        .diff-btn { padding: 8px 16px; font-size: 12px; font-weight: 700; border: 2px solid rgba(0,255,255,0.4); border-radius: 15px; background: rgba(0,50,80,0.5); color: #00ffff; cursor: pointer; }
        .diff-btn.active { background: rgba(0,255,255,0.2); border-color: #00ffff; }
        .diff-btn.easy.active { border-color: #4f4; color: #4f4; }
        .diff-btn.medium.active { border-color: #ff4; color: #ff4; }
        .diff-btn.hard.active { border-color: #f44; color: #f44; }
        .btn-start { padding: 12px 40px; font-size: 18px; font-weight: 900; background: linear-gradient(135deg, #00ffff, #0088ff); color: #000; border: none; border-radius: 30px; cursor: pointer; margin-top: 10px; }
        .upgrade-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; width: 80%; }
        .upgrade-card { padding: 12px 8px; background: linear-gradient(145deg, #1a1a3a, #252550); border: 2px solid rgba(0,255,255,0.35); border-radius: 10px; text-align: center; cursor: pointer; }
        .upgrade-card.rare { border-color: #ffd700; }
        .upgrade-card.epic { border-color: #ff00ff; }
        .upgrade-card.legendary { border-color: #ff4400; }
        .card-icon { font-size: 28px; }
        .card-name { color: #00ffff; font-size: 11px; font-weight: 700; margin: 4px 0; }
        .card-desc { color: rgba(255,255,255,0.5); font-size: 9px; }
        .game-over-stats { text-align: center; margin: 15px 0; }
        .game-over-stats p { color: #fff; font-size: 12px; margin: 8px 0; }
        .score { font-size: 24px; color: #00ffff; font-weight: 900; }
        .gold { color: #ffd700; font-size: 16px; }
        .touch-controls { display: none; position: fixed; bottom: 30px; left: 20px; z-index: 200; }
        .touch-controls.show { display: block; }
        .joystick-base { width: 90px; height: 90px; background: rgba(255,255,255,0.05); border: 2px solid rgba(0,255,255,0.3); border-radius: 50%; position: relative; }
        .joystick-knob { width: 35px; height: 35px; background: radial-gradient(circle, #00ffff, #006688); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .fire-btn { display: none; position: fixed; bottom: 40px; right: 20px; width: 65px; height: 65px; background: radial-gradient(circle, #ff4433, #aa0000); border: 2px solid #ff6655; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 800; align-items: center; justify-content: center; z-index: 200; }
        .fire-btn.show { display: flex; }
        .sound-toggle { position: fixed; top: 10px; right: 10px; font-size: 20px; z-index: 300; cursor: pointer; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="title">🚀 星际战机 <span class="version">V10 3D</span></div>
    <div class="sound-toggle" onclick="toggleSound()">🔊</div>
    
    <div id="gameContainer">
        <div id="infoBar">
            <div class="info-item"><span id="levelDisplay">1</span>关</div>
            <div class="info-item"><span id="scoreDisplay">0</span>分</div>
            <div class="info-item">💰<span id="goldDisplay">0</span></div>
            <div class="info-item"><div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="hint">电脑：WASD/方向键 | 空格射击</div>
        
        <div class="menu" id="mainMenu">
            <div class="menu-title">🚀 星际战机</div>
            <div class="menu-subtitle">V10 3D版</div>
            <div class="menu-features">
                <p>🎮 <span class="highlight">4种武器</span> - 强力火力</p>
                <p>💎 <span class="highlight">丰富道具</span> - 升级轻松</p>
                <p>👹 <span class="highlight">BOSS挑战</span> - 每5关</p>
            </div>
            <p style="color:#888;font-size:11px;">选择难度</p>
            <div class="difficulty-select">
                <button class="diff-btn easy active" onclick="setDiff('easy')">简单</button>
                <button class="diff-btn medium" onclick="setDiff('medium')">中等</button>
                <button class="diff-btn hard" onclick="setDiff('hard')">困难</button>
            </div>
            <button class="btn-start" onclick="startGame()">开始游戏</button>
        </div>
        
        <div class="menu hidden" id="upgradeMenu">
            <div class="menu-title" style="font-size:22px;">⚡ 选择升级!</div>
            <div class="upgrade-grid" id="upgradeGrid"></div>
        </div>
        
        <div class="menu hidden" id="gameOverMenu">
            <div class="menu-title">💀 游戏结束</div>
            <div class="game-over-stats">
                <p>得分 <span class="score" id="finalScore">0</span></p>
                <p>关卡 <span id="finalLevel">0</span> | BOSS <span id="finalBosses">0</span></p>
                <p class="gold">💰 <span id="finalGold">0</span></p>
            </div>
            <button class="btn-start" onclick="startGame()">再来一局</button>
        </div>
    </div>
    
    <div class="touch-controls" id="touchControls">
        <div class="joystick-base"><div class="joystick-knob" id="joystickKnob"></div></div>
    </div>
    <div class="fire-btn" id="fireBtn">开火</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // 音效
    let soundEnabled = true, audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    function playSound(t) { if (!soundEnabled || !audioCtx) return; const o=g.audioCtx.createOscillator(),g=a.audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const n=audioCtx.currentTime;if(t==='shoot'){o.frequency.setValueAtTime(660,n);o.frequency.expRampToValueAtTime(220,n+0.08);g.gain.setValueAtTime(0.08,n);g.gain.expRampToValueAtTime(0.01,n+0.08);o.start(n);o.stop(n+0.08);}else if(t==='explode'){o.type='sawtooth';o.frequency.setValueAtTime(150,n);o.frequency.expRampToValueAtTime(30,n+0.25);g.gain.setValueAtTime(0.12,n);g.gain.expRampToValueAtTime(0.01,n+0.25);o.start(n);o.stop(n+0.25);}else if(t==='powerup'){o.type='sine';o.frequency.setValueAtTime(523,n);o.frequency.setValueAtTime(659,n+0.1);o.frequency.setValueAtTime(784,n+0.2);g.gain.setValueAtTime(0.1,n);g.gain.expRampToValueAtTime(0.01,n+0.25);o.start(n);o.stop(n+0.25);}else if(t==='boss'){o.type='square';o.frequency.setValueAtTime(110,n);o.frequency.setValueAtTime(165,n+0.15);g.gain.setValueAtTime(0.1,n);g.gain.expRampToValueAtTime(0.01,n+0.3);o.start(n);o.stop(n+0.3);}}
    function toggleSound(){soundEnabled=!soundEnabled;document.querySelector('.sound-toggle').textContent=soundEnabled?'🔊':'🔇';if(soundEnabled)initAudio();}
    
    // Three.js
    let scene,camera,renderer,playerMesh,playerGlow,starField,bulletMeshes=[],enemyMeshes=[],particleMeshes=[],powerupMeshes=[],bossMesh=null,enemyBulletMeshes=[];
    function initThree(){const c=document.getElementById('gameCanvas'),w=320,h=420;c.width=w;c.height=h;scene=new THREE.Scene();scene.fog=new THREE.Fog(0x020208,5,15);camera=new THREE.PerspectiveCamera(60,w/h,0.1,100);camera.position.set(0,0,8);renderer=new THREE.WebGLRenderer({canvas:c,antialias:true});renderer.setSize(w,h);renderer.setClearColor(0x020208);const sG=new THREE.BufferGeometry(),p=new Float32Array(150*3);for(let i=0;i<150*3;i+=3){p[i]=(Math.random()-0.5)*12;p[i+1]=(Math.random()-0.5)*16;p[i+2]=-5-Math.random()*5;}sG.setAttribute('position',new THREE.BufferAttribute(p,3));starField=new THREE.Points(sG,new THREE.PointsMaterial({color:0xffffff,size:0.03,transparent:true,opacity:0.5}));scene.add(starField);scene.add(new THREE.AmbientLight(0x404040,0.5));const pl=new THREE.PointLight(0x00ffff,0.8,20);pl.position.set(0,0,5);scene.add(pl);const g=new THREE.ConeGeometry(0.15,0.4,4);g.rotateX(Math.PI/2);const m=new THREE.MeshPhongMaterial({color:0x00ffff,emissive:0x004444,shininess:100});playerMesh=new THREE.Mesh(g,m);playerMesh.position.set(0,-1.5,0);const gG=new THREE.SphereGeometry(0.08,8,8);playerGlow=new THREE.Mesh(gG,new THREE.MeshBasicMaterial({color:0x00ffff,transparent:true,opacity:0.6}));playerGlow.position.y=-0.18;playerMesh.add(playerGlow);scene.add(playerMesh);}
    function createBullet(x,y,c,e=false){const g=new THREE.SphereGeometry(0.035,6,6),m=new THREE.MeshBasicMaterial({color:c}),M=new THREE.Mesh(g,m);M.position.set(x,y,0);(e?enemyBulletMeshes:bulletMeshes).push(M);scene.add(M);}
    function createEnemy(x,y,s,c){const g=new THREE.BoxGeometry(s,s,s*0.4),m=new THREE.MeshPhongMaterial({color:c,shininess:50}),M=new THREE.Mesh(g,m);M.position.set(x,y,0);enemyMeshes.push(M);scene.add(M);}
    function createBoss(x,y,s,c){const g=new THREE.OctahedronGeometry(s),m=new THREE.MeshPhongMaterial({color:c,emissive:0x220000,shininess:80});bossMesh=new THREE.Mesh(g,m);bossMesh.position.set(x,y,0);scene.add(bossMesh);}
    function createPowerup(x,y,t){let c=t==='gold'?0xffd700:t==='heal'?0x00ff00:t==='shield'?0x00aaff:0xff00ff;const g=t==='heal'?new THREE.SphereGeometry(0.07,8,8):new THREE.OctahedronGeometry(0.07),m=new THREE.MeshPhongMaterial({color:c,emissive:c,emissiveIntensity:0.5}),M=new THREE.Mesh(g,m);M.position.set(x,y,0);M.userData.type=t;powerupMeshes.push(M);scene.add(M);}
    function createExplosion(x,y,c,n=6){for(let i=0;i<n;i++){const g=new THREE.SphereGeometry(0.015+Math.random()*0.02,4,4),m=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:1}),M=new THREE.Mesh(g,m);M.position.set(x,y,0);M.userData.vel=new THREE.Vector3((Math.random()-0.5)*0.12,(Math.random()-0.5)*0.12,0);M.userData.life=1;particleMeshes.push(M);scene.add(M);}}
    function removeMesh(M,a){const i=a.indexOf(M);if(i>-1){a.splice(i,1);scene.remove(M);}}
    
    // 游戏
    let CW=320,CH=420,diff='easy',DIFF={easy:{hp:200,enemyHp:0.4,enemySpeed:0.6,spawnRate:85,enemyDmg:10,bossHp:0.4},medium:{hp:150,enemyHp:0.8,enemySpeed:1,spawnRate:60,enemyDmg:15,bossHp:1},hard:{hp:100,enemyHp:1.2,enemySpeed:1.4,spawnRate:35,enemyDmg:22,bossHp:1.8}},WP={normal:{c:0x00ffff,d:12},spread:{c:0xff00ff,d:10},laser:{c:0x00ff00,d:18},missile:{c:0xff6600,d:28}},UP=[{i:'⚔️',n:'伤害+35%',r:'common',f:()=>P.dmg*=1.35},{i:'⚡',n:'射速+30%',r:'common',f:()=>P.fr=Math.max(80,P.fr*0.7)},{i:'👟',n:'速度+30%',r:'common',f:()=>P.spd*=1.3},{i:'❤️',n:'回血+70%',r:'common',f:()=>P.hp=Math.min(P.hp+P.maxHp*0.7,P.maxHp)},{i:'💖',n:'血上限+40%',r:'common',f:()=>{P.maxHp*=1.4;P.hp+=P.maxHp*0.2;}},{i:'🛡️',n:'护盾3秒',r:'rare',f:()=>P.shield=180},{i:'🔸',n:'散弹',r:'rare',f:()=>P.wpn='spread'},{i:'💠',n:'激光',r:'epic',f:()=>P.wpn='laser'},{i:'🚀',n:'导弹',r:'legendary',f:()=>P.wpn='missile'},{i:'🧲',n:'磁铁',r:'rare',f:()=>P.magnet=1}],ENEMY=[{hp:15,s:1.6,sc:10,g:5,w:0.45,c:0xff6666},{hp:7,s:3,sc:10,g:5,w:0.35,c:0xffff66},{hp:40,s:0.8,sc:20,g:12,w:0.6,c:0xff3333},{hp:10,s:2,sc:15,g:8,w:0.45,c:0xff66ff}],BOSS=[{hp:220,w:1.4,c:0xff0000,p:'circle'},{hp:380,w:1.7,c:0xff4400,p:'zigzag'},{hp:550,w:2.0,c:0xff00ff,p:'spread'}];
    let running=false,score=0,gold=0,level=1,bossKills=0,st=0,sr=60,P={x:0,y:-1.5,w:0.3,h:0.4,hp:100,maxHp:100,spd:0.07,wpn:'normal',dmg:12,fr:140,lf:0,inv:0,shield:0,magnet:0,dbl:0},blts=[],ens=[],eblts=[],pwr=[],bos=null,keys={},autoFire=false;
    
    function setDiff(d){diff=d;document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));document.querySelector('.diff-btn.'+d).classList.add('active');}
    
    function startGame(){initAudio();const d=DIFF[diff];bulletMeshes.forEach(m=>scene.remove(m));enemyMeshes.forEach(m=>scene.remove(m));powerupMeshes.forEach(m=>scene.remove(m));particleMeshes.forEach(m=>scene.remove(m));if(bossMesh)scene.remove(bossMesh);enemyBulletMeshes.forEach(m=>scene.remove(m));bulletMeshes=[];ens=[];eblts=[];pwr=[];particleMeshes=[];bossMesh=null;['mainMenu','upgradeMenu','gameOverMenu'].forEach(id=>document.getElementById(id).classList.add('hidden'));['gameCanvas','infoBar','hint','touchControls','fireBtn'].forEach(id=>document.getElementById(id).classList.add('show'));score=0;gold=0;level=1;bossKills=0;P={x:0,y:-1.5,w:0.3,h:0.4,hp:d.hp,maxHp:d.hp,spd:0.07,wpn:'normal',dmg:12,fr:140,lf:0,inv:0,shield:0,magnet:0,dbl:0};st=0;sr=d.spawnRate;if(!scene)initThree();if(playerMesh){playerMesh.visible=true;playerMesh.position.set(0,-1.5,0);}running=true;updateUI();lastTime=performance.now();gameLoop();}
    
    function updateUI(){document.getElementById('levelDisplay').textContent=level;document.getElementById('scoreDisplay').textContent=score;document.getElementById('goldDisplay').textContent=gold;document.getElementById('hpFill').style.width=(P.hp/P.maxHp*100)+'%';}
    
    function tryShoot(){const n=Date.now();if(n-P.lf<P.fr)return;P.lf=n;playSound('shoot');if(P.wpn==='spread'){[-22,0,22].forEach(a=>{const r=(a-90)*Math.PI/180;blts.push({x:P.x,y:P.y+0.2,vx:Math.cos(r)*0.22,vy:Math.sin(r)*0.22,c:WP[P.wpn].c});createBullet(P.x,P.y+0.2,WP[P.wpn].c);});}else if(P.wpn==='laser'){blts.push({x:P.x,y:P.y+0.2,vx:0,vy:-0.35,c:WP[P.wpn].c,laser:1});createBullet(P.x,P.y+0.2,WP[P.wpn].c);}else if(P.wpn==='missile'){blts.push({x:P.x,y:P.y+0.2,vx:0,vy:-0.16,c:WP[P.wpn].c,missile:1});createBullet(P.x,P.y+0.2,WP[P.wpn].c);}else{blts.push({x:P.x,y:P.y+0.2,vx:0,vy:-0.22,c:WP[P.wpn].c});createBullet(P.x,P.y+0.2,WP[P.wpn].c);}}
    
    function spawnEnemy(){const d=DIFF[diff],t=ENEMY[Math.floor(Math.random()*ENEMY.length)],ex=(Math.random()-0.5)*2.8;ens.push({x:ex,y:2,hp:t.hp*d.enemyHp,s:t.s*d.enemySpeed,sc:t.sc,g:t.g,w:t.w,h:t.h,c:t.c,mx:t.hp*d.enemyHp});createEnemy(ex,2,t.w,t.c);}
    function spawnBoss(){const d=DIFF[diff],i=Math.min(Math.floor((level-1)/2),BOSS.length-1),b=BOSS[i];bos={x:0,y:2,w:b.w,h:b.h,hp:b.hp*d.bossHp*(1+(level-1)*0.12),mx:b.hp*d.bossHp*(1+(level-1)*0.12),c:b.c,p:b.p,tm:0,md:1};createBoss(0,2,b.w*0.35,b.c);playSound('boss');}
    function dropPowerup(x,y){const r=Math.random();if(r<0.12){pwr.push({x,y,t:'gold',v:8*(1+P.dbl)});createPowerup(x,y,'gold');}else if(r<0.2){pwr.push({x,y,t:'heal',v:15});createPowerup(x,y,'heal');}else if(r<0.23){pwr.push({x,y,t:'shield',v:100});createPowerup(x,y,'shield');}else if(r<0.26){pwr.push({x,y,t:'weapon',opts:['spread','laser','missile']});createPowerup(x,y,'weapon');}}
    function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2;}
    
    let lastTime=0;
    function gameLoop(n=performance.now()){if(!running)return;const dt=Math.min(n-lastTime,50)/16.67,d=DIFF[diff];lastTime=n;
    if(keys['ArrowLeft']||keys['KeyA']){P.x-=P.spd*dt;if(playerMesh)playerMesh.rotation.z=0.25;}else if(keys['ArrowRight']||keys['KeyD']){P.x+=P.spd*dt;if(playerMesh)playerMesh.rotation.z=-0.25;}else if(playerMesh)playerMesh.rotation.z=0;
    if(keys['ArrowUp']||keys['KeyW'])P.y-=P.spd*dt;if(keys['ArrowDown']||keys['KeyS'])P.y+=P.spd*dt;
    P.x=Math.max(-2.2,Math.min(2.2,P.x));P.y=Math.max(-2.5,Math.min(2,P.y));
    if(playerMesh){playerMesh.position.x=P.x;playerMesh.position.y=P.y;playerGlow.scale.setScalar(0.8+Math.sin(n*0.01)*0.2);}
    if(keys['Space']||keys['KeyJ']||autoFire)tryShoot();if(P.inv>0)P.inv--;if(P.shield>0)P.shield--;
    st+=dt;if(st>=sr&&!bos){spawnEnemy();st=0;sr=Math.max(20,DIFF[diff].spawnRate-Math.floor(level*0.8));}
    
    blts.forEach((b,i)=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.missile&&ens.length>0){let t=ens[0],md=Infinity;ens.forEach(e=>{const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<md){md=d;t=e;}});if(t){const a=Math.atan2(t.y-b.y,t.x-b.x);b.vx+=Math.cos(a)*0.02*dt;b.vy+=Math.sin(a)*0.02*dt;}}if(b.y<-3||b.y>3){blts.splice(i,1);if(bulletMeshes[i])removeMesh(bulletMeshes[i],bulletMeshes);}});
    
    ens.forEach((e,i)=>{e.y-=e.s*dt*0.015;if(enemyMeshes[i])enemyMeshes[i].position.y=e.y;if(e.y<-3){ens.splice(i,1);if(enemyMeshes[i])removeMesh(enemyMeshes[i],enemyMeshes);}else if(hit(e,P)&&P.inv<=0&&P.shield<=0){P.hp-=d.enemyDmg;P.inv=40;createExplosion(P.x,P.y,0xff0000,8);}});
    
    eblts.forEach((b,i)=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if(enemyBulletMeshes[i]){enemyBulletMeshes[i].position.x=b.x;enemyBulletMeshes[i].position.y=b.y;}if(hit({x:b.x,y:b.y,w:0.1,h:0.1},P)&&P.inv<=0&&P.shield<=0){P.hp-=5;P.inv=20;eblts.splice(i,1);if(enemyBulletMeshes[i])removeMesh(enemyBulletMeshes[i],enemyBulletMeshes);}if(b.y<-3||b.y>3){eblts.splice(i,1);if(enemyBulletMeshes[i])removeMesh(enemyBulletMeshes[i],enemyBulletMeshes);}});
    
    if(bos){if(bos.y>1.5)bos.y-=0.008*dt;bos.tm+=dt*0.06;if(bos.p==='zigzag'){bos.x+=bos.md*0.03*dt;if(bos.x<-1.8||bos.x>1.8)bos.md*=-1;}if(bossMesh){bossMesh.position.x=bos.x;bossMesh.position.y=bos.y;bossMesh.rotation.x+=0.02*dt;bossMesh.rotation.y+=0.03*dt;}if(Math.floor(bos.tm)%25===0){if(bos.p==='circle'){for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;eblts.push({x:bos.x,y:bos.y,vx:Math.cos(a)*0.08,vy:Math.sin(a)*0.08});createBullet(bos.x,bos.y,0xff4444,true);}}else if(bos.p==='spread'){for(let i=-3;i<=3;i++){eblts.push({x:bos.x,y:bos.y,vx:i*0.04,vy:0.08});createBullet(bos.x,bos.y,0xff4444,true);}}else{eblts.push({x:bos.x,y:bos.y,vx:0,vy:0.1});createBullet(bos.x,bos.y,0xff4444,true);}}if(hit(bos,P)&&P.inv<=0&&P.shield<=0){P.hp-=18;P.inv=40;}}
    
    blts.forEach((b,bi)=>{ens.forEach((e,ei)=>{if(Math.abs(b.x-e.x)<e.w/2+0.05&&Math.abs(b.y-e.y)<e.h/2+0.05){e.hp-=P.dmg;if(e.hp<=0){score+=e.sc;gold+=e.g;createExplosion(e.x,e.y,e.c);dropPowerup(e.x,e.y);ens.splice(ei,1);if(enemyMeshes[ei])removeMesh(enemyMeshes[ei],enemyMeshes);}blts.splice(bi,1);if(bulletMeshes[bi])removeMesh(bulletMeshes[bi],bulletMeshes);}});if(bos&&Math.abs(b.x-bos.x)<bos.w/2+0.05&&Math.abs(b.y-bos.y)<bos.h/2+0.05){bos.hp-=P.dmg;createExplosion(b.x,b.y,bos.c,3);blts.splice(bi,1);if(bulletMeshes[bi])removeMesh(bulletMeshes[bi],bulletMeshes);if(bos.hp<=0){bossKills++;score+=400;gold+=80;createExplosion(bos.x,bos.y,bos.c,25);bos=null;if(bossMesh){scene.remove(bossMesh);bossMesh=null;}showUpgrade();}}});
    
    pwr.forEach((pp,i)=>{if(P.magnet){const dx=P.x-pp.x,dy=P.y-pp.y,dist=Math.hypot(dx,dy);if(dist<1.5){pp.x+=(dx/dist)*0.08*dt;pp.y+=(dy/dist)*0.08*dt;}}pp.y-=0.04*dt;if(powerupMeshes[i]){powerupMeshes[i].position.x=pp.x;powerupMeshes[i].position.y=pp.y;powerupMeshes[i].rotation.y+=0.05*dt;}if(hit({x:pp.x,y:pp.y,w:0.15,h:0.15},P)){if(pp.t==='gold')gold+=pp.v;else if(pp.t==='heal')P.hp=Math.min(P.hp+pp.v,P.maxHp);else if(pp.t==='shield')P.shield=pp.v;else if(pp.t==='weapon')P.wpn=pp.opts[Math.floor(Math.random()*pp.opts.length)];pwr.splice(i,1);if(powerupMeshes[i])removeMesh(powerupMeshes[i],powerupMeshes);playSound('powerup');}if(pp.y<-3){pwr.splice(i,1);if(powerupMeshes[i])removeMesh(powerupMeshes[i],powerupMeshes);}});
    
    particleMeshes.forEach((pt,i)=>{pt.position.add(pt.userData.vel);pt.userData.life-=0.05*dt;pt.material.opacity=pt.userData.life;if(pt.userData.life<=0){particleMeshes.splice(i,1);scene.remove(pt);}});
    
    if(score>level*350&&!bos){level++;sr=Math.max(20,DIFF[diff].spawnRate-Math.floor(level*0.8));if(level%5===0)spawnBoss();}
    if(P.hp<=0){running=false;['gameCanvas','infoBar','hint','touchControls','fireBtn'].forEach(id=>document.getElementById(id).classList.remove('show'));document.getElementById('finalScore').textContent=score;document.getElementById('finalLevel').textContent=level;document.getElementById('finalBosses').textContent=bossKills;document.getElementById('finalGold').textContent=gold;document.getElementById('gameOverMenu').classList.remove('hidden');}
    
    renderer.render(scene,camera);requestAnimationFrame(gameLoop);updateUI();}
    
    function showUpgrade(){running=false;['gameCanvas','infoBar','hint'].forEach(id=>document.getElementById(id).classList.remove('show'));const g=document.getElementById('upgradeGrid');g.innerHTML='';[...UP].sort(()=>Math.random()-0.5).slice(0,3).forEach(u=>{const d=document.createElement('div');d.className='upgrade-card '+u.r;d.innerHTML='<div class="card-icon">'+u.i+'</div><div class="card-name">'+u.n+'</div>';d.onclick=()=>{u.f();document.getElementById('upgradeMenu').classList.add('hidden');running=true;gameLoop();};g.appendChild(d);});document.getElementById('upgradeMenu').classList.remove('hidden');}
    
    document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});
    document.addEventListener('keyup',e=>keys[e.code]=false);
    
    const joy=document.querySelector('.joystick-base'),knob=document.getElementById('joystickKnob');let jx,jy;
    joy.addEventListener('touchstart',e=>{e.preventDefault();jx=e.touches[0].clientX;jy=e.touches[0].clientY;},{passive:false});
    joy.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],dx=t.clientX-jx,dy=t.clientY-jy,d=Math.min(25,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);knob.style.transform='translate(calc(-50%+'+Math.cos(a)*d+'px),calc(-50%+'+Math.sin(a)*d+'px))';keys['ArrowLeft']=dx<-10;keys['ArrowRight']=dx>10;keys['ArrowUp']=dy<-10;keys['ArrowDown']=dy>10;},{passive:false});
    joy.addEventListener('touchend',e=>{e.preventDefault();knob.style.transform='translate(-50%,-50%)';keys['ArrowLeft']=keys['ArrowRight']=keys['ArrowUp']=keys['ArrowDown']=false;});
    const fb=document.getElementById('fireBtn');fb.addEventListener('touchstart',e=>{e.preventDefault();autoFire=true;keys['Space']=true;},{passive:false});fb.addEventListener('touchend',e=>{e.preventDefault();autoFire=false;keys['Space']=false;});
    </script></body></html>
