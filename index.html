<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星际战机 V4 - 肉鸽版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 20px;
            background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3a 50%, #0d0d2b 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        
        /* 标题 */
        .title { color: #00ffff; font-size: 22px; font-weight: 800; text-shadow: 0 0 20px #00ffff; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .version { font-size: 12px; background: linear-gradient(135deg, #ffd700, #ff8c00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        
        /* 游戏容器 */
        #gameContainer { position: relative; width: 90%; max-width: 360px; }
        
        /* 信息栏 */
        #infoBar { display: none; width: 100%; justify-content: space-between; padding: 8px 12px; background: rgba(0,20,40,0.8); border: 1px solid rgba(0,255,255,0.3); border-radius: 8px; margin-bottom: 8px; }
        #infoBar.show { display: flex; }
        .info-item { color: #fff; font-size: 11px; display: flex; align-items: center; gap: 4px; }
        .hp-bar { width: 50px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
        .hp-fill { height: 100%; background: linear-gradient(90deg, #f44, #f84); width: 100%; transition: width 0.2s; }
        
        /* 画布 */
        #gameCanvas { display: none; width: 100%; aspect-ratio: 3/4; border: 2px solid rgba(0,255,255,0.6); border-radius: 12px; background: #050510; box-shadow: 0 0 40px rgba(0,255,255,0.15), inset 0 0 60px rgba(0,0,0,0.5); }
        #gameCanvas.show { display: block; }
        
        /* 提示 */
        #hint { display: none; color: rgba(255,255,255,0.4); font-size: 10px; margin-top: 8px; text-align: center; }
        #hint.show { display: block; }
        
        /* 全屏菜单 */
        .menu { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(180deg, #0a0a1a, #1a1a3a); z-index: 100;
            padding: 20px;
        }
        .menu.hidden { display: none; }
        
        .menu-title { color: #00ffff; font-size: 32px; font-weight: 900; margin-bottom: 10px; text-shadow: 0 0 30px #00ffff; text-align: center; }
        .menu-subtitle { color: #ffd700; font-size: 14px; margin-bottom: 30px; }
        
        .menu-features { text-align: center; margin-bottom: 30px; }
        .menu-features p { color: rgba(255,255,255,0.7); font-size: 13px; margin: 8px 0; }
        .menu-features .highlight { color: #ffd700; font-weight: 600; }
        
        .btn-start { 
            padding: 18px 60px; font-size: 22px; font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000; border: none; border-radius: 50px; 
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(0,255,255,0.4);
        }
        .btn-start:hover { transform: scale(1.08); box-shadow: 0 12px 40px rgba(0,255,255,0.6); }
        
        /* 升级卡 */
        .upgrade-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; width: 90%; max-width: 320px; }
        .upgrade-card { 
            padding: 20px 15px; background: linear-gradient(145deg, #1a1a3a, #252550); 
            border: 2px solid rgba(0,255,255,0.4); border-radius: 16px; text-align: center; 
            cursor: pointer; transition: all 0.2s;
        }
        .upgrade-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 30px rgba(0,255,255,0.3); }
        .upgrade-card.rare { border-color: #ffd700; background: linear-gradient(145deg, #2a2a1a, #3a3a2a); }
        .upgrade-card.epic { border-color: #ff00ff; background: linear-gradient(145deg, #2a1a2a, #3a2a3a); }
        .upgrade-card.legendary { border-color: #ff4400; background: linear-gradient(145deg, #2a1a15, #3a2a20); }
        
        .card-icon { font-size: 36px; margin-bottom: 8px; }
        .card-name { color: #00ffff; font-size: 15px; font-weight: 700; margin-bottom: 5px; }
        .card-desc { color: rgba(255,255,255,0.6); font-size: 11px; }
        
        /* 游戏结束 */
        .game-over-stats { text-align: center; margin: 25px 0; }
        .game-over-stats p { color: #fff; font-size: 16px; margin: 12px 0; }
        .game-over-stats .score { font-size: 28px; color: #00ffff; font-weight: 900; }
        .game-over-stats .gold { color: #ffd700; font-size: 20px; font-weight: 700; }
        
        /* 虚拟摇杆 */
        .touch-controls { display: none; position: fixed; bottom: 40px; left: 30px; z-index: 200; }
        .touch-controls.show { display: block; }
        .joystick-base { width: 110px; height: 110px; background: rgba(255,255,255,0.08); border: 3px solid rgba(0,255,255,0.4); border-radius: 50%; position: relative; }
        .joystick-knob { width: 45px; height: 45px; background: radial-gradient(circle, #00ffff, #0088aa); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 20px rgba(0,255,255,0.6); }
        
        .fire-btn { display: none; position: fixed; bottom: 55px; right: 30px; width: 75px; height: 75px; background: radial-gradient(circle, #ff5544, #cc2211); border: 3px solid #ff8877; border-radius: 50%; color: #fff; font-size: 14px; font-weight: 800; align-items: center; justify-content: center; z-index: 200; box-shadow: 0 0 25px rgba(255,0,0,0.5); }
        .fire-btn.show { display: flex; }
        
        /* 武器显示 */
        .weapon-display { position: absolute; top: 10px; right: 10px; font-size: 20px; }
    </style>
</head>
<body>
    <div class="title">🚀 星际战机 <span class="version">V4</span></div>
    
    <div id="gameContainer">
        <div id="infoBar">
            <div class="info-item">关卡 <span id="levelDisplay">1</span></div>
            <div class="info-item">分数 <span id="scoreDisplay">0</span></div>
            <div class="info-item">💰 <span id="goldDisplay">0</span></div>
            <div class="info-item"><div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div></div>
        </div>
        
        <canvas id="gameCanvas" width="360" height="480"></canvas>
        <div id="hint">电脑：WASD/方向键 | 空格射击</div>
        
        <!-- 主菜单 -->
        <div class="menu" id="mainMenu">
            <div class="menu-title">🚀 星际战机</div>
            <div class="menu-subtitle">V4 肉鸽版</div>
            <div class="menu-features">
                <p>🎮 <span class="highlight">4种武器</span> - 普通/散弹/激光/导弹</p>
                <p>💎 <span class="highlight">丰富道具</span> - 金币/血包/护盾/加速</p>
                <p>👹 <span class="highlight">BOSS挑战</span> - 每5关遭遇Boss</p>
                <p>✨ <span class="highlight">Roguelike</span> - 每次体验不同</p>
            </div>
            <button class="btn-start" onclick="startGame()">开始游戏</button>
        </div>
        
        <!-- 升级菜单 -->
        <div class="menu hidden" id="upgradeMenu">
            <div class="menu-title" style="font-size: 28px;">⚡ 选择升级!</div>
            <div class="upgrade-grid" id="upgradeGrid"></div>
        </div>
        
        <!-- 游戏结束 -->
        <div class="menu hidden" id="gameOverMenu">
            <div class="menu-title">💀 游戏结束</div>
            <div class="game-over-stats">
                <p>得分</p>
                <p class="score" id="finalScore">0</p>
                <p>关卡 <span id="finalLevel">0</span> | 击败Boss <span id="finalBosses">0</span></p>
                <p class="gold">💰 <span id="finalGold">0</span></p>
            </div>
            <button class="btn-start" onclick="startGame()">再来一局</button>
        </div>
    </div>
    
    <!-- 触摸控制 -->
    <div class="touch-controls" id="touchControls">
        <div class="joystick-base"><div class="joystick-knob" id="joystickKnob"></div></div>
    </div>
    <div class="fire-btn" id="fireBtn">开火</div>

    <script>
    // ===== 游戏配置 =====
    const V = 'V4';
    const CW = 360, CH = 480;
    
    // 武器
    const WP = { normal: {c:'#00ffff',d:10}, spread: {c:'#ff00ff',d:8}, laser: {c:'#00ff00',d:15}, missile: {c:'#ff6600',d:25} };
    
    // 升级 - 更丰富
    const UP = [
        {id:'dmg',n:'伤害+35%',i:'⚔️',d:'伤害大幅提升',r:'common',f:()=>player.dmg*=1.35},
        {id:'fr',n:'射速+25%',i:'⚡',d:'射击更快',r:'common',f:()=>player.fr=Math.max(60,player.fr*0.75)},
        {id:'spd',n:'速度+30%',i:'👟',d:'移动更快',r:'common',f:()=>player.spd*=1.3},
        {id:'heal',n:'生命恢复',i:'❤️',d:'恢复60%生命',r:'common',f:()=>player.hp=Math.min(player.hp+player.maxHp*0.6,player.maxHp)},
        {id:'maxhp',n:'生命上限',i:'💖',d:'最大生命+40%',r:'common',f:()=>{player.maxHp*=1.4;player.hp+=player.maxHp*0.2}},
        {id:'shield',n:'护盾',i:'🛡️',d:'3秒无敌',r:'rare',f:()=>player.shield=180},
        {id:'spread',n:'散弹',i:'🔸',d:'发射散弹',r:'rare',f:()=>player.wpn='spread'},
        {id:'laser',n:'激光',i:'💠',d:'穿透激光',r:'epic',f:()=>player.wpn='laser'},
        {id:'missile',n:'导弹',i:'🚀',d:'追踪导弹',r:'legendary',f:()=>player.wpn='missile'},
        {id:'magnet',n:'磁铁',i:'🧲',d:'自动吸金币',r:'rare',f:()=>player.magnet=1},
        {id:'dbl',n:'双倍金币',i:'💰',d:'金币+100%',r:'rare',f:()=>player.dbl=1},
        {id:'pen',n:'穿透',i:'🎯',d:'子弹穿透+1',r:'rare',f:()=>player.pen+=1}
    ];
    
    // 敌人
    const ENEMY = [
        {hp:25,s:2.5,sc:10,g:5,w:28,h:28,c:'#ff6666'},
        {hp:12,s:5,sc:15,g:8,w:22,h:22,c:'#ffff66'},
        {hp:70,s:1.2,sc:25,g:15,w:38,h:38,c:'#ff0000'},
        {hp:20,s:2,sc:20,g:12,w:32,h:32,c:'#ff00ff'}
    ];
    
    // BOSS
    const BOSS = [
        {hp:400,w:90,h:70,c:'#ff0000',p:'circle'},
        {hp:700,w:110,h:55,c:'#ff4400',p:'zigzag'},
        {hp:1000,w:140,h:90,c:'#ff00ff',p:'spread'}
    ];
    
    // ===== 游戏变量 =====
    const cvs = document.getElementById('gameCanvas');
    const ctx = cvs.getContext('2d');
    let running = false, score = 0, gold = 0, level = 1, bossKills = 0;
    let st = 0, sr = 60;
    
    let p = {x:160,y:400,w:36,h:46,hp:100,maxHp:100,spd:4.5,wpn:'normal',dmg:10,fr:180,lf:0,inv:0,shield:0,magnet:0,dbl:0,pen:1};
    let blts = [], ens = [], eblts = [], pwr = [], pts = [], boss = null;
    let keys = {};
    
    // ===== 游戏函数 =====
    function startGame() {
        ['mainMenu','upgradeMenu','gameOverMenu'].forEach(id=>document.getElementById(id).classList.add('hidden'));
        ['gameCanvas','infoBar','hint','touchControls','fireBtn'].forEach(id=>document.getElementById(id).classList.add('show'));
        
        score=0;gold=0;level=1;bossKills=0;
        p={x:CW/2-18,y:CH-70,w:36,h:46,hp:100,maxHp:100,spd:4.5,wpn:'normal',dmg:10,fr:180,lf:0,inv:0,shield:0,magnet:0,dbl:0,pen:1};
        blts=[];ens=[];eblts=[];pwr=[];pts=[];boss=null;
        st=0;sr=60;
        running=true;
        updateUI();
        loop();
    }
    
    function updateUI() {
        document.getElementById('levelDisplay').textContent=level;
        document.getElementById('scoreDisplay').textContent=score;
        document.getElementById('goldDisplay').textContent=gold;
        document.getElementById('hpFill').style.width=(p.hp/p.maxHp*100)+'%';
    }
    
    function shoot() {
        const now=Date.now();
        if(now-p.lf<p.fr)return;
        p.lf=now;
        const w=WP[p.wpn];
        
        if(p.wpn==='spread'){
            [-25,0,25].forEach(a=>{
                const r=(a-90)*Math.PI/180;
                blts.push({x:p.x+p.w/2,y:p.y,vx:Math.cos(r)*9,vy:Math.sin(r)*9,c:w.c});
            });
        }else if(p.wpn==='laser'){
            blts.push({x:p.x+p.w/2,y:p.y,vx:0,vy:-18,c:w.c,laser:1});
        }else if(p.wpn==='missile'){
            blts.push({x:p.x+p.w/2,y:p.y,vx:0,vy:-7,c:w.c,missile:1});
        }else{
            blts.push({x:p.x+p.w/2-3,y:p.y,vx:0,vy:-9,c:w.c});
        }
    }
    
    function spawnEnemy() {
        const t=ENEMY[Math.floor(Math.random()*ENEMY.length)];
        ens.push({x:Math.random()*(CW-t.w),y:-t.h,...t,mx:t.hp});
    }
    
    function spawnBoss() {
        const i=Math.min(Math.floor((level-1)/2),BOSS.length-1);
        const b=BOSS[i];
        boss={x:CW/2-b.w/2,y:-b.h,w:b.w,h:b.h,hp:b.hp*(1+(level-1)*0.25),mx:b.hp*(1+(level-1)*0.25),c:b.c,p:b.p,tm:0,md:1};
    }
    
    // 更多道具类型
    function dropPowerup(x,y) {
        const r=Math.random();
        if(r<0.08) pwr.push({x,y,t:'gold',v:15*(1+p.dbl)});
        else if(r<0.14) pwr.push({x,y,t:'heal',v:25});
        else if(r<0.17) pwr.push({x,y,t:'shield',v:120});
        else if(r<0.19) pwr.push({x,y,t:'speed',v:300});
        else if(r<0.21) pwr.push({x,y,t:'weapon',opts:['spread','laser','missile']});
    }
    
    function explode(x,y,col,ct=10) {
        for(let i=0;i<ct;i++){
            const a=Math.random()*Math.PI*2,s=Math.random()*3+1;
            pts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:col,lf:25});
        }
    }
    
    function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
    
    // ===== 主循环 =====
    function loop() {
        if(!running)return;
        
        // 移动
        if(keys['ArrowLeft']||keys['KeyA'])p.x-=p.spd;
        if(keys['ArrowRight']||keys['KeyD'])p.x+=p.spd;
        if(keys['ArrowUp']||keys['KeyW'])p.y-=p.spd;
        if(keys['ArrowDown']||keys['KeyS'])p.y+=p.spd;
        p.x=Math.max(0,Math.min(CW-p.w,p.x));
        p.y=Math.max(0,Math.min(CH-p.h,p.y));
        
        if(keys['Space']||keys['KeyJ'])shoot();
        if(p.inv>0)p.inv--;
        if(p.shield>0)p.shield--;
        
        // 生成
        st++;
        if(st>=sr&&!boss){spawnEnemy();st=0;sr=Math.max(18,55-level*2.5);}
        
        // 子弹
        blts.forEach((b,i)=>{
            b.x+=b.vx;b.y+=b.vy;
            if(b.missile&&ens.length>0){
                let t=ens[0],md=Infinity;
                ens.forEach(e=>{const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<md){md=d;t=e;}});
                if(t){const a=Math.atan2(t.y-b.y,t.x-b.x);b.vx+=Math.cos(a)*0.4;b.vy+=Math.sin(a)*0.4;}
            }
            if(b.y<-20||b.y>CH+20)blts.splice(i,1);
        });
        
        // 敌人
        ens.forEach((e,i)=>{
            e.y+=e.s;
            if(e.y>CH)ens.splice(i,1);
            else if(hit(e,p)&&p.inv<=0&&p.shield<=0){p.hp-=18;p.inv=50;explode(p.x+p.w/2,p.y+p.h/2,'#f00',15);}
        });
        
        // 敌弹
        eblts.forEach((b,i)=>{
            b.x+=b.vx;b.y+=b.vy;
            if(hit({x:b.x-5,y:b.y-5,w:10,h:10},p)&&p.inv<=0&&p.shield<=0){p.hp-=8;p.inv=25;eblts.splice(i,1);}
            if(b.y>CH||b.y<0)eblts.splice(i,1);
        });
        
        // BOSS
        if(boss){
            if(boss.y<25)boss.y+=0.8;
            boss.tm++;
            if(boss.p==='zigzag'){boss.x+=boss.md*2.5;if(boss.x<=0||boss.x+boss.w>=CW)boss.md*=-1;}
            if(boss.tm%25==0){
                if(boss.p==='circle'){
                    for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2;eblts.push({x:boss.x+boss.w/2,y:boss.y+boss.h/2,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5});}
                }else if(boss.p==='spread'){
                    for(let i=-4;i<=4;i++)eblts.push({x:boss.x+boss.w/2,y:boss.y+boss.h,vx:i*1.8,vy:4.5});
                }else eblts.push({x:boss.x+boss.w/2,y:boss.y+boss.h,vx:0,vy:5});
            }
            if(hit(boss,p)&&p.inv<=0&&p.shield<=0){p.hp-=25;p.inv=50;}
        }
        
        // 击中
        blts.forEach((b,bi)=>{
            ens.forEach((e,ei)=>{
                if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
                    e.hp-=p.dmg;
                    if(e.hp<=0){score+=e.sc;gold+=e.g;explode(e.x+e.w/2,e.y+e.h/2,e.c);dropPowerup(e.x+e.w/2,e.y+e.h/2);ens.splice(ei,1);}
                    blts.splice(bi,1);
                }
            });
            if(boss&&b.x>boss.x&&b.x<boss.x+boss.w&&b.y>boss.y&&b.y<boss.y+boss.h){
                boss.hp-=p.dmg;explode(b.x,b.y,boss.c,4);blts.splice(bi,1);
                if(boss.hp<=0){bossKills++;score+=500;gold+=100;explode(boss.x+boss.w/2,boss.y+boss.h/2,boss.c,35);boss=null;showUpgrade();}
            }
        });
        
        // 道具
        pwr.forEach((p,i)=>{
            if(p.magnet){
                const dx=(p.x+p.x)-p.x,dy=(p.y+p.y)-p.y,d=Math.hypot(dx,dy);
                if(d<140){p.x+=(dx/d)*4;p.y+=(dy/d)*4;}
            }
            p.y+=2.5;
            if(hit({x:p.x-12,y:p.y-12,w:24,h:24},p)){
                if(p.t==='gold')gold+=p.v;
                else if(p.t==='heal')p.hp=Math.min(p.hp+p.v,p.maxHp);
                else if(p.t==='shield')p.shield=p.v;
                else if(p.t==='speed')p.spd*=1.5;
                else if(p.t==='weapon')p.wpn=p.opts[Math.floor(Math.random()*p.opts.length)];
                pwr.splice(i,1);
            }
            if(p.y>CH)pwr.splice(i,1);
        });
        
        // 粒子
        pts.forEach((pt,i)=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.lf--;if(pt.lf<=0)pts.splice(i,1);});
        
        // 过关
        if(score>level*450&&!boss){level++;sr=Math.max(18,55-level*2.5);if(level%5===0)spawnBoss();}
        
        // 结束
        if(p.hp<=0){
            running=false;
            ['gameCanvas','infoBar','hint','touchControls','fireBtn'].forEach(id=>document.getElementById(id).classList.remove('show'));
            document.getElementById('finalScore').textContent=score;
            document.getElementById('finalLevel').textContent=level;
            document.getElementById('finalBosses').textContent=bossKills;
            document.getElementById('finalGold').textContent=gold;
            document.getElementById('gameOverMenu').classList.remove('hidden');
        }
        
        draw();
        updateUI();
        requestAnimationFrame(loop);
    }
    
    function draw(){
        ctx.fillStyle='#050510';
        ctx.fillRect(0,0,CW,CH);
        
        // 星空
        ctx.fillStyle='rgba(255,255,255,0.4)';
        for(let i=0;i<40;i++){ctx.fillRect((i*61+Date.now()*0.015)%CW,(i*37)%CH,1,1);}
        
        // 玩家
        if(p.inv%4<2){
            ctx.fillStyle=p.shield>0?'rgba(0,255,255,0.5)':'#00ffff';
            ctx.beginPath();
            ctx.moveTo(p.x+p.w/2,p.y);
            ctx.lineTo(p.x+p.w,p.y+p.h);
            ctx.lineTo(p.x+p.w/2,p.y+p.h-8);
            ctx.lineTo(p.x,p.y+p.h);
            ctx.closePath();ctx.fill();
            
            // 武器光
            ctx.fillStyle=WP[p.wpn].c;
            ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h/2,7,0,Math.PI*2);ctx.fill();
        }
        
        // 子弹
        blts.forEach(b=>{ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.laser?4:5,0,Math.PI*2);ctx.fill();});
        
        // 敌人
        ens.forEach(e=>{ctx.fillStyle=e.c;ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#222';ctx.fillRect(e.x,e.y-4,e.w,3);ctx.fillStyle='#0f0';ctx.fillRect(e.x,e.y-4,e.w*(e.hp/e.mx),3);});
        
        // BOSS
        if(boss){ctx.fillStyle=boss.c;ctx.fillRect(boss.x,boss.y,boss.w,boss.h);ctx.fillStyle='#222';ctx.fillRect(boss.x,boss.y-7,boss.w,4);ctx.fillStyle='#f00';ctx.fillRect(boss.x,boss.y-7,boss.w*(boss.hp/boss.mx),4);}
        
        // 敌弹
        eblts.forEach(b=>{ctx.fillStyle='#ff4444';ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();});
        
        // 道具
        pwr.forEach(p=>{
            ctx.fillStyle=p.t==='gold'?'#ffd700':p.t==='heal'?'#00ff00':p.t==='shield'?'#00aaff':p.t==='speed'?'#ffaa00':'#ff00ff';
            ctx.beginPath();ctx.arc(p.x,p.y,11,0,Math.PI*2);ctx.fill();
        });
        
        // 粒子
        pts.forEach(pt=>{ctx.fillStyle=pt.c;ctx.globalAlpha=pt.lf/25;ctx.beginPath();ctx.arc(pt.x,pt.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
    }
    
    function showUpgrade(){
        running=false;
        ['gameCanvas','infoBar','hint'].forEach(id=>document.getElementById(id).classList.remove('show'));
        const g=document.getElementById('upgradeGrid');
        g.innerHTML='';
        [...UP].sort(()=>Math.random()-0.5).slice(0,4).forEach(u=>{
            const d=document.createElement('div');
            d.className='upgrade-card '+u.r;
            d.innerHTML=`<div class="card-icon">${u.i}</div><div class="card-name">${u.n}</div><div class="card-desc">${u.d}</div>`;
            d.onclick=()=>{u.f();document.getElementById('upgradeMenu').classList.add('hidden');running=true;loop();};
            g.appendChild(d);
        });
        document.getElementById('upgradeMenu').classList.remove('hidden');
    }
    
    // 输入
    document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});
    document.addEventListener('keyup',e=>keys[e.code]=false);
    
    // 触摸
    const joy=document.querySelector('.joystick-base'),knob=document.getElementById('joystickKnob');
    let jx,jy;
    joy.addEventListener('touchstart',e=>{jx=e.touches[0].clientX;jy=e.touches[0].clientY;});
    joy.addEventListener('touchmove',e=>{
        e.preventDefault();
        const t=e.touches[0],dx=t.clientX-jx,dy=t.clientY-jy,d=Math.min(32,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
        knob.style.transform=`translate(calc(-50%+${Math.cos(a)*d}px),calc(-50%+${Math.sin(a)*d}px))`;
        keys['ArrowLeft']=dx<-12;keys['ArrowRight']=dx>12;keys['ArrowUp']=dy<-12;keys['ArrowDown']=dy>12;
    });
    joy.addEventListener('touchend',()=>{knob.style.transform='translate(-50%,-50%)';keys['ArrowLeft']=keys['ArrowRight']=keys['ArrowUp']=keys['ArrowDown']=false;});
    document.getElementById('fireBtn').addEventListener('touchstart',e=>{e.preventDefault();keys['Space']=true;});
    document.getElementById('fireBtn').addEventListener('touchend',e=>{e.preventDefault();keys['Space']=false;});
    </script>
