<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>星际战机 V11</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            width: 320px;
            height: 480px;
            background: linear-gradient(to bottom, #0a0a20, #1a1a3a);
            overflow: hidden;
        }
        canvas { display: block; }
        
        /* 菜单 */
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            z-index: 10;
        }
        .hidden { display: none !important; }
        
        .title { font-size: 28px; color: #0ff; text-shadow: 0 0 10px #0ff; margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: #888; margin-bottom: 30px; }
        
        .btn {
            padding: 12px 40px;
            margin: 8px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: linear-gradient(135deg, #00ccff, #0066ff);
            color: white;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        
        .diff-select { display: flex; gap: 10px; margin: 20px 0; }
        .diff-btn {
            padding: 8px 20px;
            border: 2px solid #0ff;
            border-radius: 20px;
            background: transparent;
            color: #0ff;
            cursor: pointer;
        }
        .diff-btn.active { background: #0ff; color: #000; }
        
        /* 游戏界面 */
        #hud {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 8px 15px;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 12px;
            z-index: 5;
        }
        #hpBar {
            position: absolute;
            bottom: 10px; left: 10px;
            width: 100px; height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }
        #hpFill {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #f00, #0f0);
            transition: width 0.2s;
        }
        
        /* 触控 */
        #touchControls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 120px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 5;
        }
        #joystick {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(0,255,255,0.3);
            border-radius: 50%;
            position: relative;
        }
        #joystickKnob {
            width: 40px; height: 40px;
            background: rgba(0,255,255,0.5);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        #fireBtn {
            width: 70px; height: 70px;
            background: rgba(255,0,0,0.5);
            border: 3px solid #f00;
            border-radius: 50%;
            font-size: 14px;
            color: #fff;
            font-weight: bold;
        }
        #fireBtn:active { background: rgba(255,0,0,0.8); }
        
        /* 提示 */
        .hint {
            position: absolute;
            bottom: 130px;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="320" height="480"></canvas>
        
        <!-- 主菜单 -->
        <div id="mainMenu" class="screen">
            <div class="title">🚀 星际战机</div>
            <div class="subtitle">V11 经典版</div>
            <div class="diff-select">
                <button class="diff-btn active" onclick="setDiff('easy')">简单</button>
                <button class="diff-btn" onclick="setDiff('medium')">中等</button>
                <button class="diff-btn" onclick="setDiff('hard')">困难</button>
            </div>
            <button class="btn" onclick="startGame()">开始游戏</button>
        </div>
        
        <!-- 游戏界面 -->
        <div id="hud" class="hidden">
            <span>分数: <span id="scoreDisp">0</span></span>
            <span>关卡: <span id="levelDisp">1</span></span>
        </div>
        <div id="hpBar" class="hidden"><div id="hpFill"></div></div>
        <div class="hint hidden" id="hint">WASD/方向键移动 | 空格射击</div>
        <div id="touchControls" class="hidden">
            <div id="joystick"><div id="joystickKnob"></div></div>
            <button id="fireBtn">开火</button>
        </div>
        
        <!-- 游戏结束 -->
        <div id="gameOverMenu" class="screen hidden">
            <div class="title">💀 游戏结束</div>
            <p style="color:#fff;margin:10px;">得分: <span id="finalScore">0</span></p>
            <p style="color:#fff;margin:10px;">关卡: <span id="finalLevel">1</span></p>
            <button class="btn" onclick="startGame()">再来一局</button>
            <button class="btn" onclick="showMenu()">返回菜单</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏配置
        const CONFIG = {
            easy: { playerHp: 200, enemyHp: 0.6, enemySpeed: 1.5, spawnRate: 60, enemyDmg: 5 },
            medium: { playerHp: 120, enemyHp: 1, enemySpeed: 2.5, spawnRate: 45, enemyDmg: 8 },
            hard: { playerHp: 80, enemyHp: 1.5, enemySpeed: 4, spawnRate: 30, enemyDmg: 12 }
        };
        
        // 游戏状态
        let diff = 'easy';
        let running = false;
        let score = 0, level = 1;
        let lastTime = 0, spawnTimer = 0;
        
        // 玩家
        let player = { x: 160, y: 400, w: 30, h: 40, hp: 100, maxHp: 100, speed: 4, cooldown: 0 };
        
        // 游戏对象
        let bullets = [];
        let enemies = [];
        let particles = [];
        let enemyBullets = [];
        
        // 按键
        let keys = {};
        
        // 音效
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'shoot') {
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'explode') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch(e) {}
        }
        
        // 初始化
        function init() {
            document.addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Space')e.preventDefault(); });
            document.addEventListener('keyup', e => keys[e.code] = false);
            
            // 触控
            const joy = document.getElementById('joystick');
            const knob = document.getElementById('joystickKnob');
            let jx, jy, joyDown = false;
            
            joy.addEventListener('touchstart', e => { jx = e.touches[0].clientX; jy = e.touches[0].clientY; joyDown = true; });
            joy.addEventListener('touchmove', e => {
                if(!joyDown) return;
                const dx = e.touches[0].clientX - jx;
                const dy = e.touches[0].clientY - jy;
                const dist = Math.min(20, Math.hypot(dx, dy));
                const angle = Math.atan2(dy, dx);
                knob.style.transform = `translate(calc(-50%+${Math.cos(angle)*dist}px),calc(-50%+${Math.sin(angle)*dist}px))`;
                keys['ArrowLeft'] = dx < -15;
                keys['ArrowRight'] = dx > 15;
                keys['ArrowUp'] = dy < -15;
                keys['ArrowDown'] = dy > 15;
            });
            joy.addEventListener('touchend', () => {
                joyDown = false;
                knob.style.transform = 'translate(-50%,-50%)';
                keys['ArrowLeft'] = keys['ArrowRight'] = keys['ArrowUp'] = keys['ArrowDown'] = false;
            });
            
            document.getElementById('fireBtn').addEventListener('touchstart', e => { e.preventDefault(); keys['Space'] = true; });
            document.getElementById('fireBtn').addEventListener('touchend', e => { e.preventDefault(); keys['Space'] = false; });
            
            requestAnimationFrame(gameLoop);
        }
        
        function setDiff(d) {
            diff = d;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function showMenu() {
            running = false;
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('hpBar').classList.add('hidden');
            document.getElementById('hint').classList.add('hidden');
            document.getElementById('touchControls').classList.add('hidden');
        }
        
        function startGame() {
            const cfg = CONFIG[diff];
            player = { x: 160, y: 400, w: 30, h: 40, hp: cfg.playerHp, maxHp: cfg.playerHp, speed: 4, cooldown: 0 };
            bullets = [];
            enemies = [];
            particles = [];
            enemyBullets = [];
            score = 0;
            level = 1;
            spawnTimer = 0;
            
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('hpBar').classList.remove('hidden');
            document.getElementById('hint').classList.remove('hidden');
            document.getElementById('touchControls').classList.remove('hidden');
            
            running = true;
            lastTime = performance.now();
        }
        
        function spawnEnemy() {
            const cfg = CONFIG[diff];
            const types = [
                { w: 30, h: 25, hp: 15, color: '#f66', speed: cfg.enemySpeed * 1.2, score: 10 },
                { w: 25, h: 20, hp: 8, color: '#ff6', speed: cfg.enemySpeed * 2, score: 10 },
                { w: 40, h: 35, hp: 40, color: '#f33', speed: cfg.enemySpeed * 0.8, score: 20 }
            ];
            const t = types[Math.floor(Math.random() * types.length)];
            enemies.push({
                x: 30 + Math.random() * 260,
                y: -40,
                w: t.w, h: t.h,
                hp: t.hp * cfg.enemyHp,
                speed: t.speed,
                color: t.color,
                score: t.score
            });
        }
        
        function shoot() {
            if (player.cooldown > 0) return;
            player.cooldown = 10;
            playSound('shoot');
            bullets.push({ x: player.x, y: player.y - 20, w: 6, h: 15, speed: 10 });
        }
        
        function createExplosion(x, y, color, count = 10) {
            for(let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: color,
                    size: 3 + Math.random() * 4
                });
            }
        }
        
        function gameLoop(timestamp) {
            const dt = Math.min(timestamp - lastTime, 50) / 16.67;
            lastTime = timestamp;
            
            if (running) {
                // 玩家移动
                if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed * dt;
                if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed * dt;
                if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed * dt;
                if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed * dt;
                
                player.x = Math.max(20, Math.min(300, player.x));
                player.y = Math.max(50, Math.min(440, player.y));
                
                if (player.cooldown > 0) player.cooldown--;
                if (keys['Space'] || keys['KeyJ']) shoot();
                
                // 生成敌人
                spawnTimer += dt;
                if (spawnTimer > CONFIG[diff].spawnRate) {
                    spawnEnemy();
                    spawnTimer = 0;
                }
                
                // 子弹移动
                bullets.forEach(b => b.y -= b.speed * dt);
                bullets = bullets.filter(b => b.y > -20);
                
                // 敌人移动
                enemies.forEach(e => e.y += e.speed * dt);
                
                // 碰撞检测 - 子弹打敌人
                bullets.forEach((b, bi) => {
                    enemies.forEach((e, ei) => {
                        if (Math.abs(b.x - e.x) < (b.w + e.w) / 2 && Math.abs(b.y - e.y) < (b.h + e.h) / 2) {
                            e.hp -= 10;
                            createExplosion(b.x, b.y, '#ff0', 5);
                            bullets.splice(bi, 1);
                            if (e.hp <= 0) {
                                score += e.score;
                                createExplosion(e.x, e.y, e.color, 15);
                                enemies.splice(ei, 1);
                            }
                        }
                    });
                });
                
                // 碰撞检测 - 敌人撞玩家
                enemies.forEach((e, ei) => {
                    if (Math.abs(player.x - e.x) < (player.w + e.w) / 2 && Math.abs(player.y - e.y) < (player.h + e.h) / 2) {
                        player.hp -= CONFIG[diff].enemyDmg;
                        createExplosion(e.x, e.y, e.color, 15);
                        enemies.splice(ei, 1);
                        if (player.hp <= 0) {
                            running = false;
                            document.getElementById('finalScore').textContent = score;
                            document.getElementById('finalLevel').textContent = level;
                            document.getElementById('gameOverMenu').classList.remove('hidden');
                        }
                    }
                });
                
                // 移除超出屏幕的敌人
                enemies = enemies.filter(e => e.y < 520);
                
                // 粒子更新
                particles.forEach(p => {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= 0.05 * dt;
                });
                particles = particles.filter(p => p.life > 0);
                
                // 关卡
                if (score > level * 300) level++;
                
                // 更新UI
                document.getElementById('scoreDisp').textContent = score;
                document.getElementById('levelDisp').textContent = level;
                document.getElementById('hpFill').style.width = (player.hp / player.maxHp * 100) + '%';
            }
            
            // 渲染
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function draw() {
            // 背景
            ctx.fillStyle = '#0a0a20';
            ctx.fillRect(0, 0, 320, 480);
            
            // 星空背景
            ctx.fillStyle = '#fff';
            for(let i = 0; i < 50; i++) {
                const x = (i * 73) % 320;
                const y = (i * 97 + (running ? Date.now() * 0.02 : 0)) % 480;
                ctx.fillRect(x, y, 1, 1);
            }
            
            if (!running && document.getElementById('mainMenu').classList.contains('hidden') && document.getElementById('gameOverMenu').classList.contains('hidden')) return;
            
            // 子弹
            ctx.fillStyle = '#0ff';
            bullets.forEach(b => {
                ctx.fillRect(b.x - b.w/2, b.y, b.w, b.h);
            });
            
            // 敌人
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h);
                // 敌人细节
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(e.x - e.w/4, e.y - e.h/4, e.w/2, e.h/4);
            });
            
            // 玩家
            ctx.fillStyle = '#0cf';
            // 机身
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.h/2);
            ctx.lineTo(player.x - player.w/2, player.y + player.h/2);
            ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
            ctx.closePath();
            ctx.fill();
            // 驾驶舱
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.arc(player.x, player.y - 5, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // 粒子
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        init();
    </script>
</body>
</html>
