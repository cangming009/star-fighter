<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际战机 - 肉鸽版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; background: linear-gradient(180deg, #0a0a1a, #1a1a3a); 
            font-family: sans-serif; overflow: hidden; 
        }
        h1 { color: #00ffff; margin: 10px; text-shadow: 0 0 20px #00ffff; }
        
        #gameCanvas { 
            display: none; border: 2px solid #00ffff; border-radius: 10px; 
            background: #000; margin-top: 10px;
        }
        
        .ui-panel { 
            display: none; width: 400px; justify-content: space-between; 
            color: #fff; padding: 5px; font-size: 14px;
        }
        
        .hp-bar { 
            width: 100px; height: 15px; background: #333; border-radius: 5px; overflow: hidden; 
        }
        .hp-fill { height: 100%; background: linear-gradient(90deg, #f00, #f80); width: 100%; }
        
        .btn-start { 
            padding: 20px 50px; font-size: 24px; background: linear-gradient(135deg, #0ff, #08f); 
            color: #000; border: none; border-radius: 30px; cursor: pointer; font-weight: bold;
            margin-top: 100px;
        }
        .btn-start:hover { transform: scale(1.1); box-shadow: 0 0 30px #0ff; }
        
        .menu { display: flex; flex-direction: column; align-items: center; }
        .menu h2 { color: #ffd700; font-size: 32px; margin-bottom: 20px; }
        .menu p { color: #ccc; margin: 10px; }
        
        #upgradeMenu, #gameOverMenu { display: none; }
        
        .upgrade-cards { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .card { 
            width: 100px; padding: 15px; background: linear-gradient(135deg, #224, #446); 
            border: 2px solid #0ff; border-radius: 10px; text-align: center; cursor: pointer;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0,255,255,0.5); }
        .card.rare { border-color: #ffd700; }
        .card.epic { border-color: #f0f; }
        .card.legendary { border-color: #f80; }
        .card-icon { font-size: 30px; }
        .card-name { color: #0ff; font-size: 14px; margin: 5px 0; }
        .card-desc { color: #888; font-size: 10px; }
        
        .touch-area { display: none; position: fixed; bottom: 20px; width: 100%; }
        @media (max-width: 500px) { .touch-area { display: flex; justify-content: space-between; padding: 0 20px; } }
        .joystick { width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid #0ff; position: relative; }
        .joystick-knob { width: 40px; height: 40px; background: #0ff; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .fire-btn { width: 80px; height: 80px; background: radial-gradient(#f00, #800); border-radius: 50%; border: 3px solid #f88; color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        
        .hint { color: #888; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🚀 星际战机</h1>
    
    <!-- 主菜单 -->
    <div class="menu" id="mainMenu">
        <h2>🚀 星际战机</h2>
        <p>🎮 三种武器：散弹、激光、导弹</p>
        <p>💎 击毁敌人获得升级</p>
        <p>👹 每5关遇到BOSS</p>
        <button class="btn-start" onclick="startGame()">开始游戏</button>
    </div>
    
    <!-- 游戏界面 -->
    <div class="ui-panel" id="uiPanel">
        <span>关卡: <span id="levelDisplay">1</span></span>
        <span>分数: <span id="scoreDisplay">0</span></span>
        <span>💰: <span id="goldDisplay">0</span></span>
        <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <div class="hint" id="hint">电脑：WASD/方向键移动 | 空格/J射击</div>
    
    <!-- 触摸控制 -->
    <div class="touch-area">
        <div class="joystick" id="joystick">
            <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        <div class="fire-btn" id="fireBtn">开火</div>
    </div>
    
    <!-- 升级菜单 -->
    <div class="menu" id="upgradeMenu">
        <h2>⚡ 选择升级!</h2>
        <div class="upgrade-cards" id="upgradeCards"></div>
    </div>
    
    <!-- 游戏结束 -->
    <div class="menu" id="gameOverMenu">
        <h2>💀 游戏结束</h2>
        <p>得分: <span id="finalScore">0</span></p>
        <p>关卡: <span id="finalLevel">0</span></p>
        <p>击败BOSS: <span id="finalBosses">0</span></p>
        <button class="btn-start" onclick="startGame()">再来一局</button>
    </div>

    <script>
    // 游戏变量
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let gameRunning = false;
    let score = 0, gold = 0, level = 1, bossesDefeated = 0;
    let player = { x: 180, y: 420, w: 40, h: 50, hp: 100, maxHp: 100, speed: 5, weapon: 'normal', damage: 10, fireRate: 200, lastFire: 0, invincible: 0 };
    let bullets = [], enemies = [], enemyBullets = [], powerups = [], particles = [], boss = null;
    let keys = {};
    let spawnTimer = 0, spawnRate = 60;
    
    // 配置
    const weapons = { normal: '#0ff', spread: '#f0f', laser: '#0f0', missile: '#f80' };
    const upgrades = [
        { id: 'damage', name: '伤害+30%', icon: '⚔️', desc: '伤害提升', rarity: 'common', apply: () => player.damage *= 1.3 },
        { id: 'fireRate', name: '射速+20%', icon: '⚡', desc: '射速提升', rarity: 'common', apply: () => player.fireRate *= 0.8 },
        { id: 'speed', name: '速度+25%', icon: '👟', desc: '移动加速', rarity: 'common', apply: () => player.speed *= 1.25 },
        { id: 'heal', name: '回血50%', icon: '❤️', desc: '恢复生命', rarity: 'common', apply: () => player.hp = Math.min(player.hp + player.maxHp * 0.5, player.maxHp) },
        { id: 'spread', name: '散弹', icon: '🔸', desc: '散弹武器', rarity: 'rare', apply: () => player.weapon = 'spread' },
        { id: 'laser', name: '激光', icon: '💠', desc: '穿透激光', rarity: 'epic', apply: () => player.weapon = 'laser' },
        { id: 'missile', name: '导弹', icon: '🚀', desc: '追踪导弹', rarity: 'legendary', apply: () => player.weapon = 'missile' }
    ];
    const enemyTypes = [
        { hp: 30, speed: 2, score: 10, gold: 5, w: 30, h: 30, c: '#f66' },
        { hp: 15, speed: 4, score: 15, gold: 8, w: 25, h: 25, c: '#ff6' },
        { hp: 80, speed: 1, score: 25, gold: 15, w: 40, h: 40, c: '#f00' }
    ];
    const bossTypes = [
        { hp: 500, w: 100, h: 80, c: '#f00', pattern: 'circle' },
        { hp: 800, w: 120, h: 60, c: '#f40', pattern: 'zigzag' }
    ];
    
    // 开始游戏
    function startGame() {
        console.log('Starting game...');
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('upgradeMenu').style.display = 'none';
        document.getElementById('gameOverMenu').style.display = 'none';
        document.getElementById('gameCanvas').style.display = 'block';
        document.getElementById('uiPanel').style.display = 'flex';
        document.getElementById('hint').style.display = 'block';
        
        score = 0; gold = 0; level = 1; bossesDefeated = 0;
        player = { x: 180, y: 420, w: 40, h: 50, hp: 100, maxHp: 100, speed: 5, weapon: 'normal', damage: 10, fireRate: 200, lastFire: 0, invincible: 0 };
        bullets = []; enemies = []; enemyBullets = []; powerups = []; particles = []; boss = null;
        spawnTimer = 0; spawnRate = 60;
        gameRunning = true;
        
        updateUI();
        requestAnimationFrame(gameLoop);
    }
    
    // 更新UI
    function updateUI() {
        document.getElementById('levelDisplay').textContent = level;
        document.getElementById('scoreDisplay').textContent = score;
        document.getElementById('goldDisplay').textContent = gold;
        document.getElementById('hpFill').style.width = (player.hp / player.maxHp * 100) + '%';
    }
    
    // 射击
    function shoot() {
        const now = Date.now();
        if (now - player.lastFire < player.fireRate) return;
        player.lastFire = now;
        
        if (player.weapon === 'spread') {
            [-30, 0, 30].forEach(a => {
                const r = (a - 90) * Math.PI / 180;
                bullets.push({ x: player.x + player.w/2, y: player.y, vx: Math.cos(r) * 8, vy: Math.sin(r) * 8, c: weapons.spread });
            });
        } else if (player.weapon === 'laser') {
            bullets.push({ x: player.x + player.w/2, y: player.y, vx: 0, vy: -15, c: weapons.laser, laser: true });
        } else if (player.weapon === 'missile') {
            bullets.push({ x: player.x + player.w/2, y: player.y, vx: 0, vy: -6, c: weapons.missile, missile: true });
        } else {
            bullets.push({ x: player.x + player.w/2, y: player.y, vx: 0, vy: -8, c: weapons.normal });
        }
    }
    
    // 生成敌人
    function spawnEnemy() {
        const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
        enemies.push({ x: Math.random() * (canvas.width - type.w), y: -type.h, ...type, maxHp: type.hp });
    }
    
    // 掉落道具
    function dropPowerup(x, y) {
        if (Math.random() < 0.1) powerups.push({ x, y, type: 'gold', v: 10 });
        else if (Math.random() < 0.15) powerups.push({ x, y, type: 'heal', v: 20 });
    }
    
    // 爆炸效果
    function explode(x, y, c) {
        for (let i = 0; i < 10; i++) {
            const a = Math.random() * Math.PI * 2, s = Math.random() * 3 + 1;
            particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, c, life: 30 });
        }
    }
    
    // 碰撞检测
    function hit(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }
    
    // 游戏循环
    function gameLoop() {
        if (!gameRunning) return;
        
        // 移动
        if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
        if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
        if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
        player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
        player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));
        
        if (keys['Space'] || keys['KeyJ']) shoot();
        if (player.invincible > 0) player.invincible--;
        
        // 生成敌人
        spawnTimer++;
        if (spawnTimer >= spawnRate && !boss) {
            spawnEnemy();
            spawnTimer = 0;
            spawnRate = Math.max(20, 60 - level * 3);
        }
        
        // 更新子弹
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            if (b.y < -20) bullets.splice(i, 1);
        });
        
        // 更新敌人
        enemies.forEach((e, i) => {
            e.y += e.speed;
            if (e.y > canvas.height) enemies.splice(i, 1);
            else if (hit(e, player) && player.invincible <= 0) {
                player.hp -= 20; player.invincible = 60; explode(player.x + player.w/2, player.y + player.h/2, '#f00');
            }
        });
        
        // 更新敌人子弹
        enemyBullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            if (hit({...b, w: 10, h: 10}, player) && player.invincible <= 0) {
                player.hp -= 10; player.invincible = 30; enemyBullets.splice(i, 1);
            }
            if (b.y > canvas.height) enemyBullets.splice(i, 1);
        });
        
        // 子弹击中敌人
        bullets.forEach((b, bi) => {
            enemies.forEach((e, ei) => {
                if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                    e.hp -= player.damage;
                    if (e.hp <= 0) {
                        score += e.score; gold += e.gold;
                        explode(e.x + e.w/2, e.y + e.h/2, e.c);
                        dropPowerup(e.x + e.w/2, e.y + e.h/2);
                        enemies.splice(ei, 1);
                    }
                    bullets.splice(bi, 1);
                }
            });
        });
        
        // 更新道具
        powerups.forEach((p, i) => {
            p.y += 2;
            if (hit({x: p.x - 10, y: p.y - 10, w: 20, h: 20}, player)) {
                if (p.type === 'gold') gold += p.v;
                else if (p.type === 'heal') player.hp = Math.min(player.hp + p.v, player.maxHp);
                powerups.splice(i, 1);
            }
            if (p.y > canvas.height) powerups.splice(i, 1);
        });
        
        // 更新粒子
        particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0) particles.splice(i, 1); });
        
        // 过关
        if (score > level * 500) {
            level++;
            spawnRate = Math.max(20, 60 - level * 3);
            if (level % 5 === 0) {
                const bt = bossTypes[Math.min(level/5 - 1, bossTypes.length-1)];
                boss = { x: canvas.width/2 - bt.w/2, y: -bt.h, w: bt.w, h: bt.h, hp: bt.hp, maxHp: bt.hp, c: bt.c, pattern: bt.pattern, timer: 0 };
            }
        }
        
        // 游戏结束
        if (player.hp <= 0) {
            gameRunning = false;
            document.getElementById('gameCanvas').style.display = 'none';
            document.getElementById('uiPanel').style.display = 'none';
            document.getElementById('hint').style.display = 'none';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('finalBosses').textContent = bossesDefeated;
            document.getElementById('gameOverMenu').style.display = 'flex';
        }
        
        // 绘制
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 玩家
        if (player.invincible % 4 < 2) {
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.moveTo(player.x + player.w/2, player.y);
            ctx.lineTo(player.x + player.w, player.y + player.h);
            ctx.lineTo(player.x + player.w/2, player.y + player.h - 10);
            ctx.lineTo(player.x, player.y + player.h);
            ctx.closePath();
            ctx.fill();
        }
        
        // 子弹
        bullets.forEach(b => {
            ctx.fillStyle = b.c;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.laser ? 5 : 4, 0, Math.PI * 2);
            ctx.fill();
        });
        
        // 敌人
        enemies.forEach(e => {
            ctx.fillStyle = e.c;
            ctx.fillRect(e.x, e.y, e.w, e.h);
            ctx.fillStyle = '#333';
            ctx.fillRect(e.x, e.y - 4, e.w, 3);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(e.x, e.y - 4, e.w * (e.hp / e.maxHp), 3);
        });
        
        // 敌人子弹
        enemyBullets.forEach(b => {
            ctx.fillStyle = b.c;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
            ctx.fill();
        });
        
        // 道具
        powerups.forEach(p => {
            ctx.fillStyle = p.type === 'gold' ? '#fd0' : '#0f0';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
            ctx.fill();
        });
        
        // 粒子
        particles.forEach(p => {
            ctx.fillStyle = p.c;
            ctx.globalAlpha = p.life / 30;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });
        
        updateUI();
        requestAnimationFrame(gameLoop);
    }
    
    // 键盘事件
    document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
    document.addEventListener('keyup', e => keys[e.code] = false);
    
    // 触摸控制
    const joystick = document.getElementById('joystick');
    const joystickKnob = document.getElementById('joystickKnob');
    let joyStartX, joyStartY;
    
    joystick.addEventListener('touchstart', e => {
        const t = e.touches[0];
        joyStartX = t.clientX;
        joyStartY = t.clientY;
    });
    
    joystick.addEventListener('touchmove', e => {
        e.preventDefault();
        const t = e.touches[0];
        const dx = t.clientX - joyStartX, dy = t.clientY - joyStartY;
        const dist = Math.min(30, Math.hypot(dx, dy));
        const a = Math.atan2(dy, dx);
        joystickKnob.style.transform = `translate(${Math.cos(a) * dist - 20}px, ${Math.sin(a) * dist - 20}px)`;
        keys['ArrowLeft'] = dx < -15; keys['ArrowRight'] = dx > 15;
        keys['ArrowUp'] = dy < -15; keys['ArrowDown'] = dy > 15;
    });
    
    joystick.addEventListener('touchend', () => {
        joystickKnob.style.transform = 'translate(-20px, -20px)';
        keys['ArrowLeft'] = keys['ArrowRight'] = keys['ArrowUp'] = keys['ArrowDown'] = false;
    });
    
    document.getElementById('fireBtn').addEventListener('touchstart', e => { e.preventDefault(); keys['Space'] = true; });
    document.getElementById('fireBtn').addEventListener('touchend', e => { e.preventDefault(); keys['Space'] = false; });
    </script>
</body>
</html>
